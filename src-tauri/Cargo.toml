[package]
name = "visualtalk"
version = "0.1.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "visualtalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# jsonwebtoken = "11.0.0"
chrono = "0.4.38"
dotenvy = "0.15"
ring = "0.17.8"
# Pure-Rust crypto stack — replaces jsonwebtoken + ring to avoid crypto provider panics
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
urlencoding = "2.1"
tauri-plugin-store = "2.5.0"
url = "2.5.8"
tauri-plugin-dialog = "2.8.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["process", "io-util"] }
# E2EE crypto stack (ECDH P-256 + AES-256-GCM) — only in Pro Edition
# HKDF implemented manually via hmac + sha2 to avoid digest version conflicts
p256 = { version = "0.13", features = ["ecdh"], optional = true }
aes-gcm = { version = "0.10", optional = true }

[features]
default = []
e2ee = ["p256", "aes-gcm"]
