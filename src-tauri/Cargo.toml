[package]
name = "visualtalk"
version = "3.3.33"
description = "Video-conferencing Tauri App"
authors = ["katebg@yahoo.com"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "visualtalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# jsonwebtoken = "11.0.0"
chrono = "0.4.38"
dotenvy = "0.15"
# Pure-Rust crypto stack — replaces jsonwebtoken + ring to avoid crypto provider panics
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
urlencoding = "2.1"
tauri-plugin-store = "2.5.0"
url = "2.5.8"
tauri-plugin-dialog = "2.8.1"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1", features = ["process", "io-util"] }
# Official LiveKit Rust SDK — spec-compliant AccessToken signing (replaces the
# hand-rolled JWT in token.rs) and the server API client (replaces the manual
# Twirp/reqwest calls in egress.rs).
# NOTE: `native-tls` is selected deliberately to match the reqwest TLS backend
# already in use — do NOT switch to a rustls feature, it would introduce a
# second TLS stack (and the crypto-provider ambiguity that motivated removing
# `jsonwebtoken`/`ring` originally). `default-features = false` drops `webhooks`
# which this app does not use.
livekit-api = { version = "0.9", default-features = false, features = ["access-token", "services", "native-tls"] }
# Protobuf message types shared with livekit-api (egress outputs, EgressInfo…).
livekit-protocol = "0.8"
# E2EE crypto stack (ECDH P-256 + AES-256-GCM) — only in Pro Edition
# HKDF implemented manually via hmac + sha2 to avoid digest version conflicts
p256 = { version = "0.14.0", features = ["ecdh"], optional = true }
aes-gcm = { version = "0.11.1", optional = true }
icalendar = "0.17"

# Android cross-compile: livekit-api's native-tls backend needs OpenSSL, which
# does not exist in the NDK sysroot — build it from source (openssl-src) only
# for android targets. Desktop builds keep linking the system OpenSSL.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[features]
default = []
e2ee = ["p256", "aes-gcm"]
