name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # License compliance gate: THIRD_PARTY_NOTICES.md and the in-app
  # notices module must be current, and no dependency may carry a
  # forbidden license. Must pass before any artifact is built.
  # ---------------------------------------------------------------
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Populates ~/.cargo/registry/src so the generator can read the real
      # license files instead of falling back to SPDX pointers.
      - name: Fetch crate sources
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Verify third-party notices are current and license-clean
        run: |
          python3 scripts/generate-notices.py --check
          echo "✓ notices up to date; no forbidden licenses"

      - name: Upload regenerated notices (on drift)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices-drift
          path: |
            THIRD_PARTY_NOTICES.md
            src/lib/thirdPartyNotices.js
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Desktop: macOS (Intel + Apple Silicon), Windows, Linux
  # ---------------------------------------------------------------
  desktop:
    needs: license-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'   # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'   # x86_64 Linux
            args: ''
          - platform: 'windows-latest' # x86_64 Windows
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app and create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri app (no release, branch builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.args || 'default' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.*
            src-tauri/target/**/releases/bundle/**/*.*

  # ---------------------------------------------------------------
  # Android: builds on Linux, no native Mac/Windows needed
  # ---------------------------------------------------------------
  android:
    needs: license-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android project (if not present)
        run: test -d src-tauri/gen/android || pnpm tauri android init

      - name: Decode Android signing key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p src-tauri/gen/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/app/upload-keystore.jks
          cat <<EOF > src-tauri/gen/android/keystore.properties
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android app (release AAB)
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm tauri android build --aab

      - name: Build Android app (debug APK, branch builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: pnpm tauri android build --apk --debug

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # ---------------------------------------------------------------
  # iOS: must run on a macOS runner
  # ---------------------------------------------------------------
  ios:
    needs: license-audit
    # macos-26 is pinned rather than macos-latest so the Xcode 26.6 / Swift 6.3
    # toolchain (and the iOS 26 SDK Apple requires for submission) cannot drift
    # when GitHub re-points the `latest` alias at a new runner image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned through the IOS_XCODE_VERSION repository variable rather than
          # `latest-stable`: that alias silently changes whenever GitHub refreshes
          # its runner images, so the Swift toolchain can shift under a release
          # without any commit on our side.
          #
          # 26.6 is the newest Xcode on the macos-26 runner and ships the iOS 26
          # SDK, which Apple requires for App Store submission. Do NOT fall back
          # to Xcode 16.4 to dodge the Swift 6.4 link regression from
          # tauri-apps/tauri#16130 — that regression is fixed in the `tauri`
          # 2.12.3 crate this project depends on, and building against the iOS 18
          # SDK would make the binary unsubmittable instead.
          xcode-version: ${{ vars.IOS_XCODE_VERSION || '26.6' }}

      - name: Report Xcode / Swift toolchain
        # Logged early so a failed release can be attributed to a toolchain
        # change without re-running the job.
        run: |
          xcodebuild -version
          swift --version
          XCODE_MAJOR="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          # tauri-apps/tauri#16130 (Swift 6.4 internalizing Tauri's non-public
          # @_cdecl entry points in the Release configuration) is fixed in the
          # `tauri` 2.12.3 crate, so Xcode 27 is no longer a hard blocker. A major
          # above the pin still means the runner image drifted, which makes the
          # release non-reproducible, so surface it.
          if [ "${XCODE_MAJOR:-0}" -gt 26 ]; then
            echo "::warning::Xcode ${XCODE_MAJOR} is newer than the pinned 26.6."
            echo "::warning::The runner image has drifted; set the IOS_XCODE_VERSION"
            echo "::warning::repository variable to re-pin and keep release builds"
            echo "::warning::reproducible."
          fi

      - name: Install CocoaPods and xcodegen
        # xcodegen is required by scripts/fix-ios-project.sh, which regenerates
        # visualtalk.xcodeproj from the patched project.yml. ensure-ios-toolchain.sh
        # only *warns* when xcodegen is missing, so install it explicitly here.
        run: brew install cocoapods xcodegen

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init iOS project (if not present)
        # `pnpm ios:init`, NOT a bare `tauri ios init`. The npm script chains the
        # local fixes that a bare init skips:
        #   1. ensure-ios-toolchain.sh installs rustup's `llvm-tools`. Without it
        #      swift-rs cannot re-globalize the @_cdecl symbols Xcode internalizes
        #      and emits only a `cargo:warning` before giving up — the link then
        #      fails with 9 undefined symbols instead of 3.
        #   2. fix-ios-project.sh patches project.yml: DEVELOPMENT_TEAM must be the
        #      certificate OU (not the Apple ID in the CN parentheses), plus
        #      CODE_SIGN_STYLE / CODE_SIGN_IDENTITY, plus anchoring pnpm to the repo
        #      root in the "Build Rust Code" phase (that phase runs with
        #      cwd=src-tauri/gen/apple, which has no package.json, so a bare
        #      `pnpm tauri` dies with ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL).
        #   3. fix-ios-project.sh in turn calls sync-ios-icons.sh, replacing Tauri's
        #      placeholder AppIcon set with src-tauri/icons/ios. Skipping this ships
        #      the yellow/teal Tauri logo to the App Store.
        run: test -d src-tauri/gen/apple || pnpm ios:init

      - name: Verify iOS toolchain and project fixes
        # Fail fast — before the ~20 minute Rust build — if any local iOS fix has
        # drifted or the toolchain is incomplete. Each script is idempotent and
        # --check only reports, exiting 1 on drift.
        run: |
          ./scripts/ensure-ios-toolchain.sh --check
          ./scripts/fix-ios-project.sh --check
          ./scripts/sync-ios-icons.sh --check

      - name: Import iOS signing certificate & provisioning profile
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS app (signed, for tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm tauri ios build --export-method app-store-connect

      - name: Build iOS app (unsigned, for branch builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: pnpm tauri ios build --no-sign

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            src-tauri/gen/apple/build/arm64/*.ipa
            src-tauri/gen/apple/build/*.xcarchive
